<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kangs Lab｜AI 工具入口</title>
    <meta
      name="description"
      content="Kangs Lab 整理常用 AI 工具，讓使用者快速找到圖片設計、社群文案與品牌內容工具。"
    />
    <meta name="theme-color" content="#f6f4f1" />
    <meta property="og:title" content="Kangs Lab｜AI 工具入口" />
    <meta property="og:description" content="簡單、清楚、好找的 AI 工具入口。" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="回到首頁">
        <span class="brand-mark" aria-hidden="true">KL</span>
        <span>Kangs Lab</span>
      </a>
      <nav class="site-nav" aria-label="主要導覽">
        <a href="#tools">工具</a>
        <a href="#categories">分類</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">AI Tools Hub</p>
        <h1 id="hero-title">Kangs Lab 工具入口</h1>
        <p>
          整理常用 AI 工具，讓你不用到處找連結。選擇工具，直接開啟使用。
        </p>
      </section>

      <section class="tools-shell" id="tools" aria-labelledby="tools-title">
        <div class="tools-head">
          <div>
            <p class="eyebrow">Tools</p>
            <h2 id="tools-title">所有工具</h2>
          </div>
          <p>未來新增工具時，只要加到資料列表，卡片會自動延伸。</p>
        </div>

        <div class="filter-row" id="filterRow" aria-label="工具分類篩選"></div>
        <div class="tools-grid" id="toolsGrid"></div>
      </section>

      <section class="category-strip" id="categories" aria-label="用途分類">
        <span>圖片設計</span>
        <span>社群文案</span>
        <span>品牌內容</span>
        <span>效率工作</span>
      </section>
    </main>

    <footer class="site-footer">
      <span>Kangs Lab</span>
      <span>Curated AI tools.</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
